<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📚 Library Management System</h1>
    <p>Manage Your Library Easily</p>
</header>

<main>

    <section class="dashboard">

        <div class="card">
            <h3>Total Books</h3>
            <p id="totalBooks">0</p>
        </div>

        <div class="card">
            <h3>Issued Books</h3>
            <p id="issuedBooks">0</p>
        </div>

        <div class="card">
            <h3>Available Books</h3>
            <p id="availableBooks">0</p>
        </div>

    </section>


    <section class="add-book">

        <h2>Add New Book</h2>

        <input type="text" id="bookName" placeholder="Enter Book Name">

        <input type="text" id="authorName" placeholder="Enter Author Name">

        <button onclick="addBook()">Add Book</button>

    </section>

<section class="book-section">

    <h2>Book List</h2>

    <input 
        type="text" 
        id="searchBook" 
        placeholder="Search book by name..."
        onkeyup="searchBook()"
    >
<div id="editBox" style="display:none;">
    
    <input type="text" id="editBookName" placeholder="New Book Name">
    
    <input type="text" id="editAuthorName" placeholder="New Author Name">
    
    <button onclick="saveEdit()">Save Changes</button>
    
    <button onclick="cancelEdit()">Cancel</button>
    
</div>
    <div id="bookList"></div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
